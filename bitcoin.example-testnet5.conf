## TRY:
# ./build/bin/bitcoin-gui -conf="$(pwd)/bitcoin.example-testnet5.conf" -listen=0 -v2transport=0
# Select the Testnet 5 chain (requires a Bitcoin Core build with BIP 95 support)
chain=testnet5

v2transport=0

# Enable JSON-RPC server (required for P2Pool v2 or local wallet/miner queries)
server=1

# Replace with your own strong RPC credentials
rpcuser=tn5user
rpcpassword=CHANGE_THIS_TO_A_STRONG_PASSWORD

# Optional: Enable full transaction index (useful for block explorers or wallets)
txindex=1

# Testnet 5 specific network and RPC settings
[testnet5]
port=18353
rpcport=18336
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

addnode=tn5.21m.dev:18353

# Connect directly to the active Testnet 5 bootstrap peer
addnode=tn5.21m.dev:18335

# Enable ZMQ notifications (required if connecting P2Pool v2 to this node)
zmqpubrawblock=tcp://127.0.0.1:28332
zmqpubrawtx=tcp://127.0.0.1:28333
